# audiopus_sys bundles an old Opus whose CMakeLists.txt declares a minimum
# version that CMake 4 refuses to configure. cmake-rs spawns cmake from the
# build script without project-level flags, so set the policy floor through
# the environment Cargo hands to build scripts. Remove once audiopus_sys
# ships a CMake-4-compatible bundle.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
