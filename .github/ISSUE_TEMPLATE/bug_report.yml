name: Bug report / 问题反馈
description: Report a problem with the Lynse desktop app / 反馈桌面端遇到的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整；日志文件（设置 → 关于 → 查看日志）能帮我们更快定位问题。
        Thanks for reporting! The more detail you share (especially logs from Settings → About → View logs), the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 问题描述
      description: What did you expect to happen instead? / 期望的表现是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: App version, platform, and timestamp — prefilled when reported from the in-app "报告问题" button.
      render: text
  - type: input
    id: version
    attributes:
      label: App version / 应用版本
      description: Settings → About / 设置 → 关于
      placeholder: v0.1.33
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Settings → About → View logs / 设置 → 关于 → 查看日志（可只贴相关片段）
      render: shell
