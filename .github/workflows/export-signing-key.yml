name: export-signing-key (temporary, delete after use)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to files (never logged)
        run: |
          mkdir -p out
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | base64 > out/key.b64
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" | base64 > out/pass.b64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-export
          path: out/
          retention-days: 1
