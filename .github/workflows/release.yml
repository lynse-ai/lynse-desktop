name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles msi
          - os: macos-latest
            # `app` is required alongside dmg: the macOS updater artifact
            # (.app.tar.gz + .sig) is produced from the app bundle — dmg-only
            # builds leave latest.json without a darwin entry.
            args: --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch / build STT sidecars
        run: bash apps/tauri/scripts/fetch-sidecars.sh

      - name: Smoke test sidecars
        # Offline ASR (vibeasr) is not supported on Windows yet — its binary
        # builds but cannot launch on the runner (missing MinGW runtime DLL),
        # so `--help` returns non-zero. Don't let that block the msi build.
        continue-on-error: true
        shell: bash
        run: |
          SIDECARS=apps/tauri/src-tauri/resources/sidecars
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$SIDECARS/whisper.exe" --help
            "$SIDECARS/vibeasr.exe" --help
            "$SIDECARS/ffmpeg.exe" -f lavfi -i "sine=frequency=1000:duration=1" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/tone.wav"
          else
            "$SIDECARS/whisper" --help
            "$SIDECARS/vibeasr" --help
            "$SIDECARS/ffmpeg" -f lavfi -i "sine=frequency=1000:duration=1" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/tone.wav"
          fi
          test -s "$RUNNER_TEMP/tone.wav" && echo "ffmpeg conversion OK"

      - name: Package STT runtime archive
        shell: bash
        run: |
          set -euo pipefail
          SIDECARS=apps/tauri/src-tauri/resources/sidecars
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            FILES=("whisper.exe" "vibeasr.exe" "ffmpeg.exe" "ffprobe.exe")
            ARCHIVE="lynse-stt-runtime-windows-x86_64.tar.gz"
            SHA_ENV="LYNSE_RUNTIME_SHA_WINDOWS_X86_64"
          else
            FILES=("whisper" "vibeasr" "ffmpeg" "ffprobe")
            ARCHIVE="lynse-stt-runtime-macos-aarch64.tar.gz"
            SHA_ENV="LYNSE_RUNTIME_SHA_MACOS_AARCH64"
          fi
          # NOTE: write the archive with a *relative* path (workspace root), not
          # $RUNNER_TEMP. On Windows Git Bash, $RUNNER_TEMP expands to a drive
          # path like `D:\a\_temp` which MSYS `tar` misinterprets as a remote
          # host ("Cannot connect to D:"), breaking the Windows build. A
          # relative path avoids that and is resolved correctly by tar,
          # certutil/shasum, and `gh release upload` alike.
          tar -czf "$ARCHIVE" -C "$SIDECARS" "${FILES[@]}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SHA=$(certutil -hashfile "$ARCHIVE" SHA256 | grep -v ":" | tr -d ' \r\n' | tr 'A-Z' 'a-z')
          else
            SHA=$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)
          fi
          echo "$SHA_ENV=$SHA" >> "$GITHUB_ENV"
          echo "Packaged $ARCHIVE (sha256=$SHA)"

      - name: Detect Apple signing secrets (macOS)
        # Developer ID signing + notarization is opt-in via six APPLE_*
        # secrets (see README/secrets checklist). They must stay *absent*
        # rather than empty when unset: tauri-action resolves a missing
        # secret to "" and then runs `security import ""`, which fails the
        # build. This step forwards them to later steps via GITHUB_ENV only
        # when actually present, so a repo without the secrets still releases
        # with ad-hoc signing (with a loud warning) instead of failing.
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          forwarded=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!name}"
            if [[ -n "$val" ]]; then
              echo "$name=$val" >> "$GITHUB_ENV"
              forwarded="$forwarded $name"
            fi
          done
          if [[ -z "$forwarded" ]]; then
            echo "::warning::No APPLE_* secrets are set — the macOS bundle ships ad-hoc signed (no notarization; TCC permission grants do not survive updates and microphone prompts can be suppressed for returning users)."
            exit 0
          fi
          echo "Apple signing/notarization env forwarded:$forwarded"

      - name: Stamp build number (macOS)
        # Apple requires CFBundleVersion (the build number) to strictly increase
        # over the app's lifetime, independent of the marketing version. Use the
        # workflow run number: monotonic, never resets on major/minor bumps,
        # and needs no bookkeeping in release tags (tags are pure semver now).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD="${{ github.run_number }}"
          PLIST=apps/tauri/src-tauri/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "CFBundleVersion=$BUILD stamped from run ${{ github.run_number }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public-release channel: API-key login only (no phone/WeChat).
          VITE_BUILD_CHANNEL: github
          # audiopus_sys (opus codec) vendors a CMakeLists.txt with an old
          # cmake_minimum_required, which CMake 4.x on the runners rejects.
          # Re-allow the legacy policy so the codec builds.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # Updater signing key (minisign). The matching pubkey lives in
          # apps/tauri/src-tauri/tauri.conf.json. With the key present the
          # action signs every bundle (.sig files) and generates + uploads
          # latest.json — the endpoint the in-app updater polls.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_* Developer ID signing secrets are forwarded by the
          # "Detect Apple signing secrets" step above — do not reference
          # ${{ secrets.APPLE_* }} directly here: a missing secret resolves
          # to "" and tauri-action fails on `security import ""`.
        with:
          projectPath: apps/tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Lynse ${{ github.ref_name }}"
          releaseBody: "Lynse desktop — Windows (msi) and macOS (dmg)."
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdater: true

      - name: Upload STT runtime archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARCHIVE="lynse-stt-runtime-windows-x86_64.tar.gz"
          else
            ARCHIVE="lynse-stt-runtime-macos-aarch64.tar.gz"
          fi
          gh release upload "${{ github.ref_name }}" "$ARCHIVE" --clobber
