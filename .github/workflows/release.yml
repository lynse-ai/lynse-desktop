name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Tencent CloudBase static hosting serves the in-app updater and the STT
# runtime archives (GitHub Releases is blocked/throttled from mainland China,
# so CloudBase is primary and the GitHub release stays as fallback). The env
# below is the "lynse" CloudBase environment; the only secret needed is
# CLOUDBASE_API_KEY (云开发控制台 → 环境设置 → API 密钥).
env:
  CLOUDBASE_ENV_ID: lynse-d8g49o1i956741f9e
  CLOUDBASE_UPDATES_BASE: https://lynse-d8g49o1i956741f9e-1401959758.tcloudbaseapp.com/updates

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles msi
          - os: macos-latest
            # `app` is required alongside dmg: the macOS updater artifact
            # (.app.tar.gz + .sig) is produced from the app bundle — dmg-only
            # builds leave latest.json without a darwin entry.
            args: --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS sidecar build tools
        if: runner.os == 'macOS'
        # `beforeBuildCommand` compiles the capture sidecar, which links the
        # vendored WebRTC AEC3 engine: scripts/build-webrtc-aec.sh drives that
        # build through meson + ninja (the source tarballs are vendored in-tree
        # and checksum-pinned, so nothing is fetched at build time). Neither
        # tool is preinstalled on the runner, and without them the whole macOS
        # leg dies in beforeBuildCommand — libtool, used to merge the static
        # library, does ship with the Xcode command line tools.
        run: brew install meson ninja

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch / build STT sidecars
        run: bash apps/tauri/scripts/fetch-sidecars.sh

      - name: Smoke test sidecars
        # Offline ASR (vibeasr) is not supported on Windows yet — its binary
        # builds but cannot launch on the runner (missing MinGW runtime DLL),
        # so `--help` returns non-zero. Don't let that block the msi build.
        continue-on-error: true
        shell: bash
        run: |
          SIDECARS=apps/tauri/src-tauri/resources/sidecars
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$SIDECARS/whisper.exe" --help
            "$SIDECARS/vibeasr.exe" --help
            "$SIDECARS/ffmpeg.exe" -f lavfi -i "sine=frequency=1000:duration=1" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/tone.wav"
          else
            "$SIDECARS/whisper" --help
            "$SIDECARS/vibeasr" --help
            "$SIDECARS/ffmpeg" -f lavfi -i "sine=frequency=1000:duration=1" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/tone.wav"
          fi
          test -s "$RUNNER_TEMP/tone.wav" && echo "ffmpeg conversion OK"

      - name: Detect Apple signing secrets (macOS)
        # Developer ID signing + notarization is opt-in via six APPLE_*
        # secrets (see README/secrets checklist). They must stay *absent*
        # rather than empty when unset: tauri-action resolves a missing
        # secret to "" and then runs `security import ""`, which fails the
        # build. This step forwards them to later steps via GITHUB_ENV only
        # when actually present, so a repo without the secrets still releases
        # with ad-hoc signing (with a loud warning) instead of failing.
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          forwarded=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!name}"
            if [[ -n "$val" ]]; then
              echo "$name=$val" >> "$GITHUB_ENV"
              forwarded="$forwarded $name"
            fi
          done
          if [[ -z "$forwarded" ]]; then
            echo "::warning::No APPLE_* secrets are set — the macOS bundle ships ad-hoc signed (no notarization; TCC permission grants do not survive updates and microphone prompts can be suppressed for returning users)."
            exit 0
          fi
          echo "Apple signing/notarization env forwarded:$forwarded"

      - name: Stamp build number (macOS)
        # Apple requires CFBundleVersion (the build number) to strictly increase
        # over the app's lifetime, independent of the marketing version. Use the
        # workflow run number: monotonic, never resets on major/minor bumps,
        # and needs no bookkeeping in release tags (tags are pure semver now).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD="${{ github.run_number }}"
          PLIST=apps/tauri/src-tauri/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "CFBundleVersion=$BUILD stamped from run ${{ github.run_number }}"

      - name: Resolve updater mirror base URL
        # The CloudBase hosting mirror is opt-in via the CLOUDBASE_API_KEY
        # secret. When absent the build behaves exactly as before (GitHub
        # Releases only) and the mirror-cloudbase job is skipped. Written to
        # GITHUB_ENV so the build step bakes it into the binary (option_env!)
        # as the first STT-runtime download candidate.
        shell: bash
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          if [[ -n "${CLOUDBASE_API_KEY:-}" ]]; then
            echo "LYNSE_UPDATES_MIRROR_BASE=${CLOUDBASE_UPDATES_BASE}" >> "$GITHUB_ENV"
          else
            echo "::warning::CLOUDBASE_API_KEY secret is not set — the updater stays on GitHub Releases and the mirror-cloudbase job will be skipped."
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        # The updater surfaces this text in-app: tauri-action copies the
        # release body into latest.json's `notes`, which the About page and
        # update dialog render. Falls back to the old one-liner when the
        # CHANGELOG has no section for the tagged version.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | cat -s | sed -e '/./,$!d')
          if [ -z "$BODY" ]; then
            BODY="Lynse desktop — Windows (msi) and macOS (dmg)."
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OFFICIAL channel (正式版): phone + WeChat sign-in included. The
          # artifacts land on GitHub Releases and are mirrored to the
          # CloudBase update source, which is what in-app updates serve.
          # (The debug "github" channel — API-key login only — is built via
          # `pnpm build:github`, e.g. for throwaway test builds.)
          VITE_BUILD_CHANNEL: testflight
          # audiopus_sys (opus codec) vendors a CMakeLists.txt with an old
          # cmake_minimum_required, which CMake 4.x on the runners rejects.
          # Re-allow the legacy policy so the codec builds.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # Updater signing key (minisign). The matching pubkey lives in
          # apps/tauri/src-tauri/tauri.conf.json. With the key present the
          # action signs every bundle (.sig files) and generates + uploads
          # latest.json to the GitHub Release — the origin the mirror-cloudbase
          # job rewrites and republishes to Tencent CloudBase hosting, which is
          # the endpoint the in-app updater polls first.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_* Developer ID signing secrets are forwarded by the
          # "Detect Apple signing secrets" step above — do not reference
          # ${{ secrets.APPLE_* }} directly here: a missing secret resolves
          # to "" and tauri-action fails on `security import ""`.
        with:
          projectPath: apps/tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Lynse ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdater: true

  mirror-cloudbase:
    name: Mirror updater artifacts to CloudBase hosting
    # Tags only: workflow_dispatch runs have no release to mirror from.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
    steps:
      - name: Guard on CloudBase credentials
        id: guard
        shell: bash
        run: |
          if [[ -z "${CLOUDBASE_API_KEY:-}" ]]; then
            echo "::warning::CLOUDBASE_API_KEY secret is not set — skipping the CloudBase mirror (updates stay on GitHub Releases)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir dist

      - name: Rewrite latest.json download URLs to CloudBase
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BASE="${CLOUDBASE_UPDATES_BASE}/${TAG}"
          sed -i "s#https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/#${BASE}/#g" dist/latest.json
          # Both platform entries must exist and point at CloudBase before the
          # stable endpoint is republished: a partial latest.json would send
          # live clients to a missing file.
          jq -e --arg base "$BASE" '.platforms["darwin-aarch64"].url | startswith($base)' dist/latest.json > /dev/null
          jq -e --arg base "$BASE" '.platforms["windows-x86_64"].url | startswith($base)' dist/latest.json > /dev/null
          echo "latest.json rewritten:"
          cat dist/latest.json

      - name: Upload artifacts to CloudBase hosting
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm i -g @cloudbase/cli@latest
          # Environment API key (云开发控制台 → 环境设置 → API 密钥), scoped to
          # this one environment.
          tcb login --cloudbase-api-key "${CLOUDBASE_API_KEY}" -e "${CLOUDBASE_ENV_ID}"
          # Per-tag copy first, so the stable latest.json never points at a
          # file that is not there yet.
          tcb hosting deploy dist/ "updates/${GITHUB_REF_NAME}" -e "${CLOUDBASE_ENV_ID}" --yes
          # Stable endpoint polled by the in-app updater (last, atomic flip).
          # The hosting gateway serves no-cache, so clients read it fresh.
          tcb hosting deploy dist/latest.json updates/latest.json -e "${CLOUDBASE_ENV_ID}" --yes
