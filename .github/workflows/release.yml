name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Build a draft release; stable publishing remains manual"
        required: false
        type: string
      platform:
        description: "Platform to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos

permissions:
  contents: write

# Tencent CloudBase static hosting serves the in-app updater and the STT
# runtime archives (GitHub Releases is blocked/throttled from mainland China,
# so CloudBase is primary and the GitHub release stays as fallback). The env
# below is the "lynse" CloudBase environment; the only secret needed is
# CLOUDBASE_API_KEY (云开发控制台 → 环境设置 → API 密钥).
env:
  LYNSE_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  CLOUDBASE_ENV_ID: lynse-d8g49o1i956741f9e
  CLOUDBASE_UPDATES_BASE: https://dl.lynse.cn/updates

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 provides the macOS 27 SpeechAnalyzer APIs used by the
        # Apple on-device transcription sidecar.
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["xcode-27"]' || '["windows-latest","xcode-27"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from the release tag
        # The tag is the single source of truth for the release version:
        # this stamps its semver into tauri.conf.json, apps/tauri/package.json
        # and Cargo.toml (+ its lock entry), so cutting a release never edits
        # version files by hand (the old three-place bump had already
        # drifted — Cargo.toml lagged tauri.conf.json by six releases).
        # Runs before everything that consumes a version: cargo fetch
        # --locked needs the refreshed Cargo.lock, tauri-action builds with
        # the stamped tauri.conf.json, and the notarize/verify/upload steps
        # read the stamped package.json for the dmg paths. A workflow_dispatch
        # from a branch (no release_tag) keeps the checked-in versions.
        shell: bash
        run: node apps/tauri/scripts/sync-version-from-tag.cjs "${LYNSE_RELEASE_TAG}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS sidecar build tools
        if: runner.os == 'macOS'
        # `beforeBuildCommand` compiles the capture sidecar, which links the
        # vendored WebRTC AEC3 engine: scripts/build-webrtc-aec.sh drives that
        # build through meson + ninja (the source tarballs are vendored in-tree
        # and checksum-pinned, so nothing is fetched at build time). Neither
        # tool is preinstalled on the runner, and without them the whole macOS
        # leg dies in beforeBuildCommand — libtool, used to merge the static
        # library, does ship with the Xcode command line tools.
        run: brew install meson ninja

      - name: Install Vulkan SDK (Windows whisper build)
        if: runner.os == 'Windows'
        # The Windows whisper.cpp sidecar is compiled with GGML_VULKAN: one
        # binary serves NVIDIA / AMD / Intel GPUs, and vulkan-1.dll is shipped
        # inside the runtime archive so end users need no separate Vulkan
        # runtime install. The SDK provides the headers, import lib and glslc
        # shader compiler the ggml Vulkan backend builds against.
        #
        # The humbletim/install-vulkan-sdk action unpacks the installer with
        # 7z, but since SDK 1.4.313 the official Windows installer appends its
        # payloads AFTER the 7z stream ("data after the end of archive"), so
        # only the bootstrap tools unpack — Include/ and Lib/ are missing and
        # CMake's FindVulkan fails (upstream issues #21/#25). Run the official
        # installer silently instead: it produces the standard
        # C:\VulkanSDK\<ver>\{Include,Lib,Bin} layout and exports VULKAN_SDK
        # for the CMake configure and the fetch-sidecars loader copy.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Invoke-WebRequest -Uri 'https://vulkan.lunarg.com/sdk/latest/windows.txt' -UseBasicParsing).Content.Trim()
          Write-Host "Installing Vulkan SDK $version"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" -OutFile vulkan_sdk.exe
          $p = Start-Process -FilePath .\vulkan_sdk.exe -Wait -PassThru -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdk/Include/vulkan/vulkan.h")) { throw "Vulkan SDK headers missing at $sdk" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Windows code-signing secrets
        id: winsign
        if: runner.os == 'Windows'
        # Windows 11 Smart App Control (and SmartScreen) block unsigned binaries
        # with "we couldn't verify the publisher". Signing is opt-in via secrets,
        # mirroring the macOS APPLE_* behaviour: a repo without credentials
        # still releases (unsigned, with a loud warning) instead of failing.
        #
        #   LYNSE_WINDOWS_SIGN_COMMAND (secret, recommended for production)
        #       Command template for any cloud-HSM / key-vault signer. `{file}`
        #       (or "{file}") is replaced with the quoted absolute path and
        #       $env:SECRET references are expanded. Example:
        #       AzureSignTool sign -kvu <url> -kvc <cert> -kvi <id> -kvs <secret> -tr http://timestamp.digicert.com -td sha256 {file}
        #       Every exe/dll/msi passes through this one command.
        #   WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD (secrets)
        #       Base64 .pfx for self-signed rehearsal / legacy certificates.
        #       Public CAs stopped issuing exportable .pfx in June 2023.
        #   WINDOWS_TIMESTAMP_URL (variable, optional)
        #       RFC3161 server; defaults to http://timestamp.digicert.com.
        #   LYNSE_REQUIRE_WINDOWS_SIGNING (variable, "1" to enforce)
        #       Fail the build instead of warning when nothing is configured.
        #
        # Secrets must stay absent rather than empty when unset. Credentials are
        # forwarded through GITHUB_ENV so tauri build's child processes inherit
        # them; the enabled output (not env) gates the later steps because GITHUB_ENV
        # values are not reliably visible in step-level `if` expressions.
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WIN_SIGN_COMMAND: ${{ secrets.LYNSE_WINDOWS_SIGN_COMMAND }}
          WIN_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          REQUIRE_SIGNING: ${{ vars.LYNSE_REQUIRE_WINDOWS_SIGNING }}
        run: |
          $enabled = $false
          if (($env:WIN_CERT -and -not $env:WIN_CERT_PASSWORD) -or (-not $env:WIN_CERT -and $env:WIN_CERT_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together'
          }
          if ($env:WIN_SIGN_COMMAND) {
            $cmd = ($env:WIN_SIGN_COMMAND -replace '[\r\n]+', ' ').Trim()
            Add-Content $env:GITHUB_ENV "LYNSE_WINDOWS_SIGN_COMMAND=$cmd"
            $enabled = $true
          }
          if ($env:WIN_CERT -and $env:WIN_CERT_PASSWORD) {
            # GITHUB_ENV is line-based: strip any whitespace a pasted base64
            # blob may contain, and any newline in the password.
            $b64 = $env:WIN_CERT -replace '\s', ''
            $pass = $env:WIN_CERT_PASSWORD -replace '[\r\n]+', ''
            Add-Content $env:GITHUB_ENV "WINDOWS_CERTIFICATE=$b64"
            Add-Content $env:GITHUB_ENV "WINDOWS_CERTIFICATE_PASSWORD=$pass"
            $enabled = $true
          }
          if ($env:WIN_TIMESTAMP_URL) {
            Add-Content $env:GITHUB_ENV "WINDOWS_TIMESTAMP_URL=$($env:WIN_TIMESTAMP_URL)"
          }
          if ($env:REQUIRE_SIGNING) {
            Add-Content $env:GITHUB_ENV "LYNSE_REQUIRE_WINDOWS_SIGNING=$($env:REQUIRE_SIGNING)"
          }
          Add-Content $env:GITHUB_OUTPUT "enabled=$($enabled.ToString().ToLowerInvariant())"
          if (-not $enabled -and $env:REQUIRE_SIGNING -eq '1') {
            # The signer script is never reached when every signing step is
            # gated off, so enforce the opt-in here instead.
            throw 'LYNSE_REQUIRE_WINDOWS_SIGNING=1 but no Windows code-signing credentials are configured'
          }
          if ($enabled) {
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host '::warning::No Windows code-signing secrets configured — the MSI and lynse-tauri.exe ship UNSIGNED and Windows 11 Smart App Control will block them. See the "Detect Windows code-signing secrets" step in release.yml.'
          }

      - name: Verify runtime help checks
        run: bash apps/tauri/scripts/test-sidecar-help.sh

      - name: Verify prerelease mirror isolation
        if: runner.os != 'Windows'
        run: python apps/tauri/scripts/test-prerelease-mirror.py

      - name: Fetch / build STT sidecars
        run: bash apps/tauri/scripts/fetch-sidecars.sh

      - name: Authenticode-sign Windows STT sidecars
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        # The on-demand runtime archive is NOT part of the MSI, so Tauri's
        # signCommand never sees these binaries. Sign them BEFORE the archive
        # is tarred (its SHA and the updater manifest are computed afterwards,
        # so re-hashing stays correct) and before the smoke test, which then
        # also proves signing did not corrupt the executables.
        # Third-party release binaries (FunASR, FFmpeg) are re-signed under the
        # Lynse publisher: Smart App Control judges every process, so an
        # unsigned sidecar would still be blocked at transcription time.
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'apps/tauri/scripts/sign-windows.ps1'
          $sidecars = Join-Path $env:GITHUB_WORKSPACE 'apps/tauri/src-tauri/resources/sidecars'
          $files = @(Get-ChildItem -LiteralPath $sidecars -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw "No Windows sidecar binaries found in $sidecars" }
          Write-Host "Signing $($files.Count) sidecar binaries"
          & $script -Files $files -Verify

      - name: Smoke test sidecars
        # Every sidecar must launch: the Windows vibeasr.exe is statically
        # linked, so `--help` succeeding proves no MinGW runtime DLL is needed.
        # A failure here blocks the msi/dmg build — shipping an archive whose
        # binary cannot start would make the VibeVoice model card uninstalleable
        # end-to-end (download OK, transcribe dead).
        #
        # The list is read from the client's own completeness gate
        # (`stt::RUNTIME_BINARIES`) rather than repeated here: a second copy is
        # exactly how an archive shipped without a binary that every client then
        # rejects as permanently "incomplete".
        shell: bash
        run: |
          SIDECARS=apps/tauri/src-tauri/resources/sidecars
          EXT=""; [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          REQUIRED=$(awk '/pub\(crate\) const RUNTIME_BINARIES/{f=1} f{print} f&&/\];/{exit}' apps/tauri/src-tauri/src/stt.rs | grep -oE '"[a-z0-9-]+"' | tr -d '"')
          # A parse that silently yielded nothing would vacuously pass the loop.
          echo "$REQUIRED" | grep -qx whisper \
            || { echo "::error::could not read RUNTIME_BINARIES from stt.rs"; exit 1; }
          echo "required runtime binaries: $(echo $REQUIRED | tr '\n' ' ')"
          # Share one extraction with the packaging gate below rather than
          # parsing stt.rs twice and letting the two drift.
          echo "RUNTIME_BINARY_LIST=$(echo $REQUIRED | tr '\n' ' ')" >> "$GITHUB_ENV"
          for base in $REQUIRED; do
            test -s "$SIDECARS/$base$EXT" \
              || { echo "::error::$base$EXT missing from sidecars — fetch-sidecars.sh did not produce it"; exit 1; }
            if [ "$base" = ffmpeg ] || [ "$base" = ffprobe ]; then
              "$SIDECARS/$base$EXT" -version > /dev/null || { echo "::error::$base$EXT cannot start"; exit 1; }
            else
              bash apps/tauri/scripts/verify-sidecar-help.sh "$SIDECARS/$base$EXT" > /dev/null \
                || { echo "::error::$base$EXT cannot start"; exit 1; }
            fi
            echo "    $base$EXT launches"
          done
          "$SIDECARS/ffmpeg$EXT" -f lavfi -i "sine=frequency=1000:duration=1" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/tone.wav"
          test -s "$RUNNER_TEMP/tone.wav" && echo "ffmpeg conversion OK"

      - name: Package STT runtime archive
        id: runtime
        # The on-demand shared runtime (lib.rs ensure_runtime_available) is
        # downloaded at first offline-model install from the GitHub release /
        # CloudBase mirror. The archive SHA is stamped into the app binary via
        # GITHUB_ENV → option_env! (LYNSE_RUNTIME_SHA_*); the mirror-cloudbase
        # job re-uploads the archive to CloudBase together with the installers.
        # Runs BEFORE the Tauri build so the SHA is visible to the Rust build.
        shell: bash
        run: |
          set -euo pipefail
          SIDECARS=apps/tauri/src-tauri/resources/sidecars
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            PLATFORM=macos-aarch64
            SHA_VAR=LYNSE_RUNTIME_SHA_MACOS_AARCH64
          else
            PLATFORM=windows-x86_64
            SHA_VAR=LYNSE_RUNTIME_SHA_WINDOWS_X86_64
          fi
          # Hard gate: a Windows archive without the Vulkan loader would pass
          # the client's completeness check but silently run CPU-only; and an
          # archive missing ANY `RUNTIME_BINARIES` entry is rejected by
          # every client as permanently "incomplete", so it must not ship.
          # Reuse the list parsed by the smoke step (RUNTIME_BINARY_LIST) —
          # parsing stt.rs a second time here is how the two gates drift apart,
          # and a `for` over an empty expansion vacuously passes.
          EXT=""; [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -s "$SIDECARS/vulkan-1.dll" \
              || { echo "::error::vulkan-1.dll missing from sidecars — the whisper build went out CPU-only"; exit 1; }
          fi
          test -n "${RUNTIME_BINARY_LIST// }" \
            || { echo "::error::RUNTIME_BINARY_LIST is empty — the smoke step did not export it"; exit 1; }
          for base in $RUNTIME_BINARY_LIST; do
            test -s "$SIDECARS/$base$EXT" \
              || { echo "::error::$base$EXT missing — the client's runtime completeness check would fail"; exit 1; }
          done
          ARCHIVE="lynse-stt-runtime-$PLATFORM.tar.gz"
          tar -czf "$ARCHIVE" -C "$SIDECARS" .
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          echo "$SHA_VAR=$SHA" >> "$GITHUB_ENV"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "packaged $ARCHIVE (sha256 $SHA)"
          ls -la "$ARCHIVE"

      - name: Detect Apple signing secrets (macOS)
        # Developer ID signing + notarization is opt-in via six APPLE_*
        # secrets (see README/secrets checklist). They must stay *absent*
        # rather than empty when unset: tauri-action resolves a missing
        # secret to "" and then runs `security import ""`, which fails the
        # build. This step forwards them to later steps via GITHUB_ENV only
        # when actually present, so a repo without the secrets still releases
        # with ad-hoc signing (with a loud warning) instead of failing.
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          forwarded=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!name}"
            if [[ -n "$val" ]]; then
              echo "$name=$val" >> "$GITHUB_ENV"
              forwarded="$forwarded $name"
            fi
          done
          if [[ -z "$forwarded" ]]; then
            echo "::warning::No APPLE_* secrets are set — the macOS bundle ships ad-hoc signed (no notarization; TCC permission grants do not survive updates and microphone prompts can be suppressed for returning users)."
            exit 0
          fi
          echo "Apple signing/notarization env forwarded:$forwarded"

      - name: Developer ID sign the audio-capture sidecar (macOS)
        # Notarization rejects nested resource binaries that are ad-hoc signed
        # or lack a secure timestamp, and Hardened Runtime blocks the helper's
        # microphone without the audio-input entitlement. tauri imports the
        # certificate into its own temporary keychain only during bundling —
        # AFTER beforeBuildCommand has already built this helper — so sign it
        # here, in a throwaway keychain that is deleted afterwards (leaving
        # tauri's own import unambiguous). The build script's stamp check then
        # skips the rebuild inside the tauri build step, preserving the
        # signature.
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lynse-sidecar.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$CERT"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          pnpm --filter @lynse/tauri build:audio-capture
          codesign --force --options runtime --timestamp \
            --entitlements apps/tauri/src-tauri/Entitlements-sidecar-direct.plist \
            --sign "$APPLE_SIGNING_IDENTITY" apps/tauri/src-tauri/resources/sidecars/audio-capture
          codesign --force --options runtime --timestamp \
            --entitlements apps/tauri/src-tauri/Entitlements-sidecar-direct.plist \
            --sign "$APPLE_SIGNING_IDENTITY" apps/tauri/src-tauri/resources/sidecars/apple-transcribe
          codesign --verify --strict --verbose=1 apps/tauri/src-tauri/resources/sidecars/audio-capture
          codesign --verify --strict --verbose=1 apps/tauri/src-tauri/resources/sidecars/apple-transcribe
          security delete-keychain "$KEYCHAIN"

      - name: Stamp build number (macOS)
        # Apple requires CFBundleVersion (the build number) to strictly increase
        # over the app's lifetime, independent of the marketing version. Use the
        # workflow run number: monotonic.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD="${{ github.run_number }}"
          PLIST=apps/tauri/src-tauri/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "CFBundleVersion=$BUILD stamped from run ${{ github.run_number }}"

      - name: Resolve updater mirror base URL
        # The CloudBase hosting mirror is opt-in via the CLOUDBASE_API_KEY
        # secret. When absent the build behaves exactly as before (GitHub
        # Releases only) and the mirror-cloudbase job is skipped. Written to
        # GITHUB_ENV so the build step bakes it into the binary (option_env!)
        # as the first STT-runtime download candidate.
        shell: bash
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          if [[ -n "${CLOUDBASE_API_KEY:-}" ]]; then
            echo "LYNSE_UPDATES_MIRROR_BASE=${CLOUDBASE_UPDATES_BASE}" >> "$GITHUB_ENV"
          else
            echo "::warning::CLOUDBASE_API_KEY secret is not set — the updater stays on GitHub Releases and the mirror-cloudbase job will be skipped."
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        # The updater surfaces this text in-app: tauri-action copies the
        # release body into latest.json's `notes`, which the About page and
        # update dialog render. Falls back to the old one-liner when the
        # CHANGELOG has no section for the tagged version.
        run: |
          set -euo pipefail
          VERSION="${LYNSE_RELEASE_TAG#v}"
          VERSION="${VERSION%%-*}"
          # Literal prefix match, not a regex: version headings may contain
          # build-counter parentheses (`## 1.1.4(2) (date)`) that a regex
          # would parse as a capture group.
          BODY=$(awk -v ver="$VERSION" '
            index($0, "## " ver " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | cat -s | sed -e '/./,$!d')
          if [ -z "$BODY" ]; then
            BODY="Lynse desktop — Windows (msi) and macOS (dmg)."
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify macOS relaunch logging regression
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo fetch --manifest-path apps/tauri/src-tauri/Cargo.toml --locked
          python3 apps/tauri/scripts/test-logging-relaunch.py

      - name: Configure Tauri Windows signCommand
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        # signCommand runs INSIDE `tauri build`: Tauri signs the main exe and
        # the MSI before computing the minisign updater .sig. Re-signing the
        # MSI after the build would silently invalidate every in-app update.
        # Only this CI working copy is mutated (the main tauri.conf.json, so
        # the setting cannot be lost to platform-config merging), with an
        # absolute script path because tauri build's cwd is not guaranteed.
        shell: pwsh
        run: |
          node apps/tauri/scripts/configure-windows-signing.cjs `
            --script (Join-Path $env:GITHUB_WORKSPACE 'apps/tauri/scripts/sign-windows.ps1')

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OFFICIAL channel (正式版): phone + WeChat sign-in included. The
          # artifacts land on GitHub Releases and are mirrored to the
          # CloudBase update source, which is what in-app updates serve.
          # (The debug channel — API-key login only — is built via
          # `pnpm build:debug`, e.g. for throwaway test builds.)
          VITE_BUILD_CHANNEL: official
          # Keep on-demand runtimes attached to the exact release, including beta tags.
          LYNSE_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          # audiopus_sys (opus codec) vendors a CMakeLists.txt with an old
          # cmake_minimum_required, which CMake 4.x on the runners rejects.
          # Re-allow the legacy policy so the codec builds.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # Updater signing key (minisign). The matching pubkey lives in
          # apps/tauri/src-tauri/tauri.conf.json. With the key present the
          # action signs every bundle (.sig files) and generates + uploads
          # latest.json to the GitHub Release — the origin the mirror-cloudbase
          # job rewrites and republishes to Tencent CloudBase hosting, which is
          # the endpoint the in-app updater polls first.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_* Developer ID signing secrets are forwarded by the
          # "Detect Apple signing secrets" step above — do not reference
          # ${{ secrets.APPLE_* }} directly here: a missing secret resolves
          # to "" and tauri-action fails on `security import ""`.
        with:
          projectPath: apps/tauri
          # app is required alongside dmg for the macOS updater archive.
          args: ${{ matrix.os == 'windows-latest' && '--bundles msi' || '--bundles app,dmg' }}
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Lynse ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          includeRelease: true
          includeUpdaterJson: true

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        # Hard gate: a release whose signing silently no-oped is worse than an
        # unsigned release, because the updater .sig would then cover a
        # different MSI than the one users install.
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $exe = Join-Path $root 'apps/tauri/src-tauri/target/release/lynse-tauri.exe'
          $msiDir = Join-Path $root 'apps/tauri/src-tauri/target/release/bundle/msi'
          $msi = @(Get-ChildItem -LiteralPath $msiDir -Filter '*.msi' -File | Select-Object -First 1)
          if ($msi.Count -eq 0) { throw "No MSI found under $msiDir" }
          foreach ($f in @($exe, $msi[0].FullName)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing release artifact: $f" }
            $sig = Get-AuthenticodeSignature -FilePath $f
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
              throw "No Authenticode signature on $f (status $($sig.Status))"
            }
            Write-Host "OK $($sig.Status) — $f — $($sig.SignerCertificate.Subject)"
          }

      - name: Notarize and staple macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./apps/tauri/package.json").version')
          DMG="apps/tauri/src-tauri/target/release/bundle/dmg/Lynse_${VERSION}_aarch64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 20m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify actual macOS release artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./apps/tauri/package.json").version')
          BUNDLE=apps/tauri/src-tauri/target/release/bundle
          bash apps/tauri/scripts/verify-macos-release.sh \
            "$BUNDLE/macos/Lynse.app.tar.gz" \
            "$BUNDLE/dmg/Lynse_${VERSION}_aarch64.dmg" "$VERSION"

      - name: Upload verified stapled macOS installer
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p 'require("./apps/tauri/package.json").version')
          gh release upload "$LYNSE_RELEASE_TAG" \
            "apps/tauri/src-tauri/target/release/bundle/dmg/Lynse_${VERSION}_aarch64.dmg" \
            --repo "${{ github.repository }}" --clobber

      - name: Upload STT runtime archive to the release
        # Tag builds and explicitly named draft-release builds.
        # The mirror-cloudbase job downloads every release asset, so the
        # archive is mirrored to updates/<tag>/ on CloudBase automatically —
        # the layout lib.rs runtime_mirror_url() expects.
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$LYNSE_RELEASE_TAG" "${{ steps.runtime.outputs.archive }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Upload STT runtime archive as workflow artifact
        # Dispatch builds: attach the archive to the workflow run so a Windows
        # installer + matching runtime can be tested without cutting a tag.
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.runtime.outputs.archive }}
          path: ${{ steps.runtime.outputs.archive }}
          if-no-files-found: error

  publish-prerelease:
    name: Publish test installers without changing stable updates
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prerelease mirror isolation on the publishing host
        run: python3 apps/tauri/scripts/test-prerelease-mirror.py

      - name: Publish the verified prerelease
        run: >-
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          --draft=false --prerelease --latest=false

      - name: Setup Node
        if: env.CLOUDBASE_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI
        if: env.CLOUDBASE_API_KEY != ''
        run: npm i -g @cloudbase/cli@latest

      - name: Mirror test downloads without changing stable updates
        if: env.CLOUDBASE_API_KEY != ''
        run: bash apps/tauri/scripts/mirror-release-to-cloudbase.sh "${GITHUB_REF_NAME}" --prerelease

  mirror-cloudbase:
    name: Mirror updater artifacts to CloudBase
    # Tags only: a dispatch run has no published release to mirror.
    #
    # This job is the reason the in-app updater works at all. The client polls
    # `updates/latest.json` on CloudBase first (GitHub Releases is throttled from
    # mainland China); if this mirror does not run, the release ships on GitHub
    # while the endpoint every installed client reads keeps advertising the
    # previous version — silently, for months. Dropping this job in 48602a24
    # stranded the live manifest on 1.1.0; `verify-updates` below now catches
    # that class of failure, and remirror-updates.yml repairs an old tag.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard on CloudBase credentials
        id: guard
        shell: bash
        run: |
          if [[ -z "${CLOUDBASE_API_KEY:-}" ]]; then
            echo "::warning::CLOUDBASE_API_KEY secret is not set — the CloudBase mirror is skipped, so the endpoint the in-app updater polls will NOT learn about ${GITHUB_REF_NAME}. Releases stay on GitHub only."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm i -g @cloudbase/cli@latest

      - name: Publish the verified GitHub release
        if: steps.guard.outputs.configured == 'true'
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Mirror the release to CloudBase hosting
        if: steps.guard.outputs.configured == 'true'
        # The script rewrites the release's own latest.json onto the CloudBase
        # base, uploads the per-tag copy first, asserts every asset is reachable,
        # and only then flips the stable pointer.
        run: bash apps/tauri/scripts/mirror-release-to-cloudbase.sh "${GITHUB_REF_NAME}"

  verify-updates:
    name: Verify the served updater manifest
    # Independent confirmation that the public endpoint actually advertises the
    # version just released. Reads the live URL, not any build output, so a
    # mirror that silently did nothing fails here.
    needs: [build, mirror-cloudbase]
    if: >-
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && always() &&
      needs.build.result == 'success' &&
      needs.mirror-cloudbase.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Assert the live manifest matches this tag
        shell: bash
        env:
          WANT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # export: the assertion runs in node, which only sees exported vars
          export WANT="${WANT_VERSION#v}"
          URL="$CLOUDBASE_UPDATES_BASE/latest.json?cb=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl -fsSL --max-time 20 "$URL" -o live.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("live.json", "utf8"));
            const want = process.env.WANT;
            const errs = [];
            if (m.version !== want) errs.push(`served version ${JSON.stringify(m.version)} != ${want} for this tag`);
            for (const p of ["darwin-aarch64", "windows-x86_64"]) {
              if (!m.platforms?.[p]?.url) errs.push(`served manifest has no "${p}" entry`);
            }
            if (errs.length) { console.error(errs.join("\n")); process.exit(1); }
            console.log(`manifest ok — version ${m.version}, platforms ${Object.keys(m.platforms).join(", ")}`);
            for (const [p, e] of Object.entries(m.platforms)) console.log(`  ${p}: ${e.url}`);
          '
          # Then prove the advertised files are actually downloadable.
          for url in $(node -e 'const m=JSON.parse(require("fs").readFileSync("live.json","utf8"));console.log(Object.values(m.platforms).map(p=>p.url).join("\n"))'); do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 20 "$url")"
            if [ "$code" != "200" ]; then
              echo "::error::updater manifest advertises an unreachable artifact (HTTP $code): $url"
              exit 1
            fi
            echo "200 $url"
          done
