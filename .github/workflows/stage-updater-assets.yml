name: Stage signed Windows updater assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing build tag, for example v1.2.0-build247
        required: true
        type: string
      expected_commit:
        description: Exact source commit of the verified build
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    # GitHub only exposes draft releases to tokens with push access.
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the signed build and verify its source and hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish,assets > assets.json
          ACTUAL_COMMIT="$(node -p 'JSON.parse(require("fs").readFileSync("assets.json", "utf8")).targetCommitish')"
          [[ "$ACTUAL_COMMIT" == "$EXPECTED_COMMIT" ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir stage --pattern '*.msi*' --pattern latest.json --pattern lynse-stt-runtime-windows-x86_64.tar.gz
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assets = JSON.parse(fs.readFileSync('assets.json', 'utf8')).assets;
          for (const name of fs.readdirSync('stage')) {
            const entry = assets.find(asset => asset.name === name);
            const data = fs.readFileSync(`stage/${name}`);
            const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
            if (!entry || data.length !== entry.size || digest !== entry.digest) throw new Error(`Artifact mismatch: ${name}`);
            console.log(`Verified ${name}: ${digest}`);
          }
          NODE
      - name: Install the pinned hosting CLI
        run: npm install --global @cloudbase/cli@3.8.6
      - name: Stage artifacts without changing the stable update pointer
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_API_KEY"
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e lynse-d8g49o1i956741f9e
          tcb hosting deploy stage "updates/$RELEASE_TAG" -e lynse-d8g49o1i956741f9e --json
