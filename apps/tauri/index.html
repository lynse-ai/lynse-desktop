<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lynse</title>
    <script>
      // Optimistically mark the sidebar transparent before Rust reports back, so
      // it never flashes an opaque background on first paint. Rust corrects this
      // via the `lynse://window-effects` event if the native material is absent.
      if (/Mac/i.test(navigator.platform || navigator.userAgent)) {
        document.documentElement.dataset.windowEffects = "vibrancy";
      }
    </script>
    <script>
      // Pre-paint pass of the appearance customization (packages/views/settings/
      // app-theme-boot.ts APP_THEME_BOOT_SNIPPET — keep the two in sync). Colors
      // only: the full font/contrast/surface pass runs in bootstrap via
      // initAppTheme().
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("lynse-theme-custom") || "{}");
          var t = localStorage.getItem("theme");
          var dark;
          if (t === "dark" || t === "light") dark = t === "dark";
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var b = dark ? raw.dark || {} : raw.light || {};
          var canonical = dark
            ? { a: "#e0b15c", b: "#17181b", f: "#f5f3ee" }
            : { a: "#5f67d8", b: "#fafafa", f: "#202023" };
          // Authored preset trios — mirror APP_THEME_PRESETS in app-theme.ts.
          var trios = {
            linear: { light: { a: "#5e6ad2", b: "#fcfcfd", f: "#1b1b1b" }, dark: { a: "#5e6ad2", b: "#08090a", f: "#f7f8f8" } },
            notion: { light: { a: "#2383e2", b: "#ffffff", f: "#37352f" }, dark: { a: "#2383e2", b: "#191919", f: "#d4d4d4" } },
            sepia: { light: { a: "#a9683c", b: "#f6f0e4", f: "#43382b" }, dark: null },
            midnight: { light: null, dark: { a: "#e0b15c", b: "#000000", f: "#f5f3ee" } },
            nord: { light: null, dark: { a: "#88c0d0", b: "#2e3440", f: "#eceff4" } },
          };
          var trio = trios[b.preset] ? trios[b.preset][dark ? "dark" : "light"] : null;
          var a = b.accent || (trio && trio.a) || canonical.a;
          var bg = b.background || (trio && trio.b) || canonical.b;
          var fg = b.foreground || (trio && trio.f) || canonical.f;
          var st = document.documentElement.style;
          ["--primary", "--ring", "--brand", "--info", "--waveform-active", "--sidebar-primary", "--sidebar-ring", "--chart-1"].forEach(function (v) { st.setProperty(v, a); });
          var lin = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
          var hx = a.slice(1); if (hx.length === 3) hx = hx[0] + hx[0] + hx[1] + hx[1] + hx[2] + hx[2];
          var lum = 0.2126 * lin(parseInt(hx.slice(0, 2), 16)) + 0.7152 * lin(parseInt(hx.slice(2, 4), 16)) + 0.0722 * lin(parseInt(hx.slice(4, 6), 16));
          st.setProperty("--primary-foreground", lum > 0.45 ? "#15110a" : "#ffffff");
          st.setProperty("--background", bg);
          ["--foreground", "--card-foreground", "--popover-foreground", "--sidebar-foreground", "--secondary-foreground", "--accent-foreground"].forEach(function (v) { st.setProperty(v, fg); });
          if (b.translucentSidebar) document.documentElement.dataset.translucentSidebar = "true";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
