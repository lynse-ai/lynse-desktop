[package]
name = "lynse-tauri"
version = "1.2.2"
description = "Lynse macOS desktop shell"
authors = ["Lynse"]
edition = "2021"

[lib]
name = "lynse_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Statically link the shared WebRTC AEC3 library (`lynse_webrtc_aec`) for the
# dual-track echo canceller. Off by default: the correlation-gate fallback is
# built in and needs no C++ toolchain. Windows release builds enable this once
# the static library is vendored (see scripts/build-lynse-aec3.ps1).
aec3 = []

[profile.release]
strip = "none"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fern = "0.7"
futures-util = "0.3"
hmac = "0.12"
hkdf = "=0.12.4"
libsodium-rs = "=0.3.0"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
log = "0.4"
md-5 = "0.10"
mime_guess = "2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "=1.9.0"

# macOS-only: EventKit bridge for system calendar integration.
[target.'cfg(target_os = "macos")'.dependencies]
highlandcows-eventkit = "0.5.8"
# Native window materials. 0.8 is required for the Liquid Glass API
# (`apply_liquid_glass`); Tauri itself still pins 0.6 internally, so cargo
# keeps two copies — window-vibrancy 0.8 is explicitly built to tolerate that.
window-vibrancy = "0.8"
objc2 = "0.6"
# NSWorkspace/NSRunningApplication power the meeting detector's coarse
# fallback path (see meeting_detector/macos.rs). NSWindow/NSView walk the
# hierarchy to reach the WKWebView for the problem-report screenshot
# (see report_screenshot.rs). NSSharingService gates both the service and
# the picker classes for the note share sheet (see share_file in lib.rs);
# NSApplication reaches the key window to anchor the picker.
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSBitmapImageRep", "NSImage", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSharingService", "NSView", "NSWindow", "NSWorkspace"] }
# NSNumber is ungated in objc2-foundation 0.3 (no feature of its own).
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSURL"] }
# Microphone TCC prompt from the main app process (see mic_permission.rs):
# the grant must be attributed to the Lynse bundle, not the capture sidecar,
# to survive App Store / TestFlight packaging.
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

# Windows-only: microphone capture for live translation (stage 1), plus the
# WASAPI session enumeration behind the meeting detector. The dual-track
# meeting capture engine talks to WASAPI directly (loopback + RAW-mode mic).
[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
# JPEG encoding for the problem-report screenshot (PrintWindow capture).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # PrintWindow + PRINT_WINDOW_FLAGS live under Storage::Xps in windows-rs.
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# Direct dep so `windows::core::implement`'s expanded paths resolve (the
# IMMNotificationClient callback).
windows-core = "0.61"
