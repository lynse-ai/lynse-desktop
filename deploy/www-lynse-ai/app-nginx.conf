# lynse-desktop web app on https://www.lynse.ai/app/ — include from the
# revelspark site's 443 server block (see activate step in deploy.sh).
# Same-origin subpath: required by the MCP bridge, which sends no CORS
# headers and checks Origin against https://www.lynse.ai exactly.
#
# Entry paths bounce straight to a real route: Next normalizes /app/ away
# (trailingSlash: false) while nginx would add it back — proxying them would
# create a redirect loop between the two.

location = /app {
    return 302 /app/home;
}

location = /app/ {
    return 302 /app/home;
}

location /app/ {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    access_log off;
    client_max_body_size 25m;
    proxy_read_timeout 300s;
}
