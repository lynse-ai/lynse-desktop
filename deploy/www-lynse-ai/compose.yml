services:
  web:
    image: node:22-alpine
    working_dir: /srv
    command: node apps/web/server.js
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "127.0.0.1:3102:3000"
    volumes:
      - ./bundle:/srv:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/app/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
