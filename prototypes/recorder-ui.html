<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录音界面原型 — 华为录音机风格 (浅色 / 深色)</title>
<style>
  :root {
    --pps: 64px;            /* horizontal px per second, mirrored in JS */
  }
  body[data-theme="light"] {
    --bg: #f6f6f6;
    --strip: #ececec;
    --bar: #8e8e93;
    --text: #171717;
    --text-2: #9e9e9e;
    --text-3: #b9b9be;
    --red: #e23e33;
    --btn-bg: #ffffff;
    --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    --icon: #2c2c2e;
    --ruler-label: #9e9e9e;
    --ruler-tick: #c2c2c7;
    --meta-border: #d4d4d8;
    --meta-bg: rgba(255, 255, 255, 0.85);
  }
  body[data-theme="dark"] {
    --bg: #0d0d0f;
    --strip: #1d1d1f;
    --bar: #98989d;
    --text: #f4f4f5;
    --text-2: #8d8d92;
    --text-3: #55555a;
    --red: #ff5145;
    --btn-bg: #232326;
    --btn-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    --icon: #e6e6e8;
    --ruler-label: #7c7c81;
    --ruler-tick: #3a3a3f;
    --meta-border: #3a3a3f;
    --meta-bg: rgba(29, 29, 31, 0.85);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "HarmonyOS Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .screen { display: flex; flex-direction: column; height: 100%; }

  /* ---------- Header ---------- */
  .header {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 232px 12px 26px;   /* right padding leaves room for the meta switcher */
  }
  .back-btn { background: none; border: none; color: var(--icon); cursor: pointer; padding: 6px; display: flex; border-radius: 8px; }
  .back-btn:hover { background: var(--strip); }
  .header-title { font-size: 21px; font-weight: 600; }
  .header-spacer { flex: 1; }
  .header-icon { color: var(--icon); display: flex; }

  /* ---------- Time ruler ---------- */
  .ruler { position: relative; height: 48px; }
  .ruler canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Waveform strip ---------- */
  .strip { position: relative; height: 246px; flex-shrink: 0; }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .screen.pb .strip { cursor: grab; touch-action: none; }
  .screen.pb .strip.dragging { cursor: grabbing; }

  /* ---------- Timer block ---------- */
  .timer-block { text-align: center; margin-top: 26px; }
  .timer-main { font-size: 58px; font-weight: 500; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .timer-sub { margin-top: 4px; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .flex-spacer { flex: 1; }

  /* ---------- Recording bottom bar ---------- */
  .rec-bottom {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 40px 34px; max-width: 1100px; width: 100%; margin: 0 auto;
  }
  .icon-action {
    background: none; border: none; cursor: pointer; color: var(--icon);
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-2); font-family: inherit;
    justify-self: center; padding: 6px 10px; border-radius: 12px;
  }
  .icon-action svg { display: block; color: var(--icon); }
  .icon-action:hover { opacity: 0.75; }
  .stop-btn {
    width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--btn-bg); box-shadow: var(--btn-shadow);
    display: flex; align-items: center; justify-content: center; justify-self: center;
    transition: transform 0.15s ease;
  }
  .stop-btn:hover { transform: scale(1.04); }
  .stop-btn:active { transform: scale(0.97); }
  .stop-square { width: 30px; height: 30px; border-radius: 8px; background: var(--red); }

  /* ---------- Playback bottom ---------- */
  .pb-bottom { display: flex; flex-direction: column; align-items: center; gap: 34px; padding: 0 40px 30px; }
  .fn-row { display: flex; justify-content: center; gap: 64px; }
  .fn-action {
    background: none; border: none; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-2); padding: 6px 10px; border-radius: 12px;
  }
  .fn-action svg { display: block; color: var(--icon); }
  .fn-action:hover { opacity: 0.75; }
  .fn-action.active, .fn-action.active svg { color: var(--red); }
  .play-circle {
    width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--btn-bg); box-shadow: var(--btn-shadow); color: var(--icon);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .play-circle:hover { transform: scale(1.04); }
  .play-circle:active { transform: scale(0.97); }

  /* ---------- Prototype meta switcher ---------- */
  .meta {
    position: fixed; top: 14px; right: 16px; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    background: var(--meta-bg); border: 1px solid var(--meta-border);
    border-radius: 999px; padding: 6px 8px; backdrop-filter: blur(10px);
    font-size: 12px;
  }
  .seg { display: flex; background: transparent; border-radius: 999px; padding: 0; }
  .seg button {
    border: none; background: none; font-family: inherit; font-size: 12px;
    color: var(--text-2); padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .seg button.on { background: var(--strip); color: var(--text); font-weight: 600; }
  .meta-divider { width: 1px; height: 16px; background: var(--meta-border); }
  .hint {
    position: fixed; left: 18px; bottom: 12px; z-index: 50;
    font-size: 11px; color: var(--text-3); line-height: 1.6;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%) translateY(8px);
    background: var(--strip); color: var(--text); font-size: 13px;
    padding: 9px 18px; border-radius: 999px; box-shadow: var(--btn-shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-theme="light">

<!-- ======================= Recording screen ======================= -->
<div class="screen rec" id="recScreen">
  <div class="header">
    <button class="back-btn" id="recBack" title="重新开始">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="header-title">录音</div>
    <div class="header-spacer"></div>
    <div class="header-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="7" x2="8" y2="17"/>
        <line x1="12" y1="4" x2="12" y2="20"/><line x1="16" y1="7" x2="16" y2="17"/><line x1="20" y1="10" x2="20" y2="14"/>
      </svg>
    </div>
  </div>
  <div class="ruler"><canvas id="recRuler"></canvas></div>
  <div class="strip" id="recStripWrap"><canvas id="recStrip"></canvas></div>
  <div class="timer-block">
    <div class="timer-main" id="recTimer">00:00.00</div>
    <div class="timer-sub" id="recSub">预计还能录制 10 小时以上</div>
  </div>
  <div class="flex-spacer"></div>
  <div class="rec-bottom">
    <button class="icon-action" id="recMarkerBtn">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M6.5 3.5h11V21l-5.5-3.8L6.5 21z"/>
      </svg>
      <span>标记</span>
    </button>
    <button class="stop-btn" id="stopBtn" title="停止录音">
      <div class="stop-square"></div>
    </button>
    <button class="icon-action" id="recPauseBtn">
      <svg id="recPauseIcon" width="25" height="25" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6.5" y="4.5" width="3.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="3.6" height="15" rx="1.6"/>
      </svg>
      <span id="recPauseLabel">暂停</span>
    </button>
  </div>
</div>

<!-- ======================= Playback screen ======================= -->
<div class="screen pb" id="pbScreen" style="display:none">
  <div class="header">
    <button class="back-btn" id="pbBack" title="返回">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="header-title">未命名录音</div>
    <div class="header-spacer"></div>
    <div class="header-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h2l2-5 3 10 3-14 3 12 2-3h3"/>
      </svg>
    </div>
  </div>
  <div class="ruler"><canvas id="pbRuler"></canvas></div>
  <div class="strip" id="pbStripWrap"><canvas id="pbStrip"></canvas></div>
  <div class="timer-block">
    <div class="timer-main" id="pbTimer">00:00.00</div>
    <div class="timer-sub" id="pbSub">00:00.00</div>
  </div>
  <div class="flex-spacer"></div>
  <div class="pb-bottom">
    <div class="fn-row">
      <button class="fn-action" id="fnTranscribe">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="3"/>
          <path d="M10.3 7.5l1.7 7M13.7 7.5l-1.7 7M10.9 11.8h2.2"/>
          <path d="M8.5 17.5h7"/>
        </svg>
        <span>转文本</span>
      </button>
      <button class="fn-action" id="fnEdit">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20l4.5-1L20 7.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20z"/><path d="M14.5 6.5l3 3"/>
        </svg>
        <span>编辑</span>
      </button>
      <button class="fn-action" id="fnSkipSilence">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
          <path d="M15.5 9l5 6M20.5 9l-5 6"/>
        </svg>
        <span>跳过静音</span>
      </button>
      <button class="fn-action" id="fnSpeed">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/>
          <text id="speedText" x="12" y="15.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="currentColor" stroke="none">1.0x</text>
        </svg>
        <span>倍速播放</span>
      </button>
      <button class="fn-action" id="fnMarker">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M6.5 3.5h11V21l-5.5-3.8L6.5 21z"/>
        </svg>
        <span>标记</span>
      </button>
    </div>
    <button class="play-circle" id="pbPlayBtn" title="播放 / 暂停">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path id="pbPlayIcon" d="M8.5 5.5 L19 12 L8.5 18.5 Z"/></svg>
    </button>
  </div>
</div>

<!-- ======================= Prototype meta controls ======================= -->
<div class="meta">
  <div class="seg" id="screenSeg">
    <button data-screen="rec" class="on">录音中</button>
    <button data-screen="pb">回放</button>
  </div>
  <div class="meta-divider"></div>
  <div class="seg" id="themeSeg">
    <button data-theme="light" class="on">浅色</button>
    <button data-theme="dark">深色</button>
  </div>
</div>
<div class="hint">原型演示 · 回放界面可拖动波形回看 · 空格 = 暂停/播放</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
 * Constants
 * ============================================================ */
const PPS        = 64;    // horizontal px per second
const BAR_PITCH  = 8;     // css px between bar centers
const BAR_WIDTH  = 3;     // css px bar thickness
const BPS        = PPS / BAR_PITCH;  // bars per second (8)
const ENV_RATE   = 100;   // envelope samples per second
const STRIP_OVERHANG = 12; // css px below the band for the playhead dot

const COLOR_RED = "var(--red)"; // resolved via getComputedStyle at draw time

/* ============================================================
 * Speech-like envelope (deterministic, seeded)
 * ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let envSec = 0;
let env = null;

function buildEnvelope(seconds, seed) {
  const n = Math.ceil(seconds * ENV_RATE);
  const out = new Float32Array(n);
  const rnd = mulberry32(seed);
  let i = 0, speaking = true, prevAmp = 0.03;
  while (i < n) {
    const len = speaking ? 0.7 + rnd() * 2.1 : 0.22 + rnd() * 0.9;
    const base = speaking ? 0.32 + rnd() * 0.62 : 0.03 + rnd() * 0.05;
    const syllFreq = 2.2 + rnd() * 2.0;
    const phase = rnd() * Math.PI * 2;
    const lenS = Math.round(len * ENV_RATE);
    for (let k = 0; k < lenS && i < n; k++, i++) {
      const tt = k / ENV_RATE;
      let a = speaking
        ? base * (0.55 + 0.45 * Math.sin(2 * Math.PI * syllFreq * tt + phase))
        : base;
      const edge = Math.min(k, lenS - k) / ENV_RATE;
      const smooth = Math.min(1, edge / 0.06);
      a = prevAmp + (a - prevAmp) * smooth;
      out[i] = Math.max(0.012, a);
    }
    if (i > 0) prevAmp = out[i - 1];
    speaking = !speaking;
  }
  return out;
}

function ensureEnvelope(seconds) {
  if (env && seconds <= envSec) return;
  envSec = Math.max(seconds, envSec ? envSec * 2 : 700);
  env = buildEnvelope(envSec, 20260906);
}
ensureEnvelope(700);

function hash1(i) {
  const s = Math.sin(i * 127.1) * 43758.5453;
  return s - Math.floor(s);
}
function envAt(t) {
  if (t < 0) return 0;
  const x = t * ENV_RATE;
  const i0 = Math.floor(x);
  if (i0 + 1 >= env.length) return env[env.length - 1] || 0;
  const f = x - i0;
  return env[i0] * (1 - f) + env[i0 + 1] * f;
}
function levelAtBar(i) {
  return Math.min(1, envAt(i / BPS) * (0.8 + 0.2 * hash1(i)));
}

/* ============================================================
 * Per-screen state
 * ============================================================ */
const rec = {
  t: 8.90,
  duration: 8.90,
  paused: false,
  markers: [],
  viewT: 8.90,
  viewTTarget: 8.90,
};
const pb = {
  t: 13.95,
  duration: 398.37,   // 06:38.37, mirrors the reference
  playing: false,
  speed: 1.0,
  skipSilence: false,
  markers: [],
  viewT: 13.95,
  viewTTarget: 13.95,
};
let screen = "rec"; // "rec" | "pb"

/* ============================================================
 * Canvas plumbing
 * ============================================================ */
const els = {
  recScreen: document.getElementById("recScreen"),
  pbScreen: document.getElementById("pbScreen"),
  recRuler: document.getElementById("recRuler"),
  recStrip: document.getElementById("recStrip"),
  recStripWrap: document.getElementById("recStripWrap"),
  pbRuler: document.getElementById("pbRuler"),
  pbStrip: document.getElementById("pbStrip"),
  pbStripWrap: document.getElementById("pbStripWrap"),
  recTimer: document.getElementById("recTimer"),
  pbTimer: document.getElementById("pbTimer"),
  pbSub: document.getElementById("pbSub"),
  recPauseIcon: document.getElementById("recPauseIcon"),
  recPauseLabel: document.getElementById("recPauseLabel"),
  pbPlayIcon: document.getElementById("pbPlayIcon"),
  speedText: document.getElementById("speedText"),
  fnSkipSilence: document.getElementById("fnSkipSilence"),
  toast: document.getElementById("toast"),
};

function fitCanvas(cv) {
  const r = cv.parentElement.getBoundingClientRect();
  const d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d));
  cv.height = Math.max(1, Math.round(r.height * d));
  cv._w = r.width; cv._h = r.height;
  cv.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
}
[els.recRuler, els.recStrip, els.pbRuler, els.pbStrip].forEach((cv) => {
  new ResizeObserver(() => fitCanvas(cv)).observe(cv.parentElement);
  fitCanvas(cv);
});

function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
function rr(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
  else ctx.fillRect(x, y, w, h);
}

/* ============================================================
 * Rendering
 * ============================================================ */
function renderRuler(cv, viewT) {
  const ctx = cv.getContext("2d");
  const w = cv._w, h = cv._h;
  ctx.clearRect(0, 0, w, h);

  const tickColor = cssVar("--ruler-tick");
  const labelColor = cssVar("--ruler-label");
  const tLeft = viewT - (w / 2) / PPS;
  const tRight = viewT + (w / 2) / PPS;
  const xOf = (time) => (time - viewT) * PPS + w / 2;
  const baseY = 27;

  // baseline under the labels
  ctx.strokeStyle = tickColor;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(0, baseY + 0.5); ctx.lineTo(w, baseY + 0.5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // labels every 2s, ticks: 0.5s minor / 1s medium / 2s major
  ctx.font = "12.5px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = labelColor;
  const start = Math.ceil(tLeft * 2) / 2;
  for (let s = start; s <= tRight; s += 0.5) {
    if (s < 0) continue;
    const x = Math.round(xOf(s)) + 0.5;
    const isMajor = Math.abs(s / 2 - Math.round(s / 2)) < 1e-6;
    const isSec = Math.abs(s - Math.round(s)) < 1e-6;
    const th = isMajor ? 12 : isSec ? 8 : 5;
    ctx.beginPath();
    ctx.moveTo(x, baseY); ctx.lineTo(x, baseY + th);
    ctx.stroke();
    if (isMajor) {
      const m = Math.floor(s / 60), sec = Math.round(s % 60);
      ctx.fillText(String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0"), x, 17);
    }
  }
}

function renderStrip(cv, state) {
  const ctx = cv.getContext("2d");
  const w = cv._w, h = cv._h;
  ctx.clearRect(0, 0, w, h);

  const stripColor = cssVar("--strip");
  const barColor = cssVar("--bar");
  const red = cssVar("--red");
  const bandH = h - STRIP_OVERHANG;
  const mid = bandH / 2;

  // band
  ctx.fillStyle = stripColor;
  ctx.fillRect(0, 0, w, bandH);

  // bars
  ctx.fillStyle = barColor;
  const maxBarH = bandH * 0.42;   // amplitude on one side
  const tLeft = state.viewT - (w / 2) / PPS;
  const tRight = state.viewT + (w / 2) / PPS;
  const iStart = Math.max(0, Math.floor(tLeft * BPS) - 1);
  const iEnd = Math.ceil(tRight * BPS) + 1;
  for (let i = iStart; i <= iEnd; i++) {
    const x = (i / BPS - state.viewT) * PPS + w / 2;
    if (x < -BAR_PITCH || x > w + BAR_PITCH) continue;
    const lvl = levelAtBar(i);
    const bh = Math.max(3, lvl * maxBarH * 2);   // tiny bars render as the dotted baseline
    rr(ctx, x - BAR_WIDTH / 2, mid - bh / 2, BAR_WIDTH, bh, 1.5);
  }

  // markers: small red ticks at the bottom of the band
  ctx.fillStyle = red;
  for (const m of state.markers) {
    const x = (m - state.viewT) * PPS + w / 2;
    if (x < -4 || x > w + 4) continue;
    rr(ctx, x - 1.25, bandH - 15, 2.5, 15, 1);
  }

  // playhead: red line + dot hanging at the bottom edge
  const px = (state.t - state.viewT) * PPS + w / 2;
  ctx.fillStyle = red;
  ctx.fillRect(px - 1.25, 0, 2.5, bandH);
  ctx.beginPath();
  ctx.arc(px, bandH + 2.5, 5, 0, Math.PI * 2);
  ctx.fill();
}

/* ============================================================
 * Formatting
 * ============================================================ */
function fmtTimer(s) {
  const cs = Math.floor((s % 1) * 100);
  const sec = Math.floor(s) % 60;
  const min = Math.floor(s / 60);
  return String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0") + "." + String(cs).padStart(2, "0");
}

/* ============================================================
 * Toast
 * ============================================================ */
let toastTimer = null;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1600);
}

/* ============================================================
 * Actions
 * ============================================================ */
function syncRecUI() {
  els.recPauseIcon.innerHTML = rec.paused
    ? '<path d="M8 5.5 L19 12 L8 18.5 Z"/>'
    : '<rect x="6.5" y="4.5" width="3.6" height="15" rx="1.6"/><rect x="13.9" y="4.5" width="3.6" height="15" rx="1.6"/>';
  els.recPauseLabel.textContent = rec.paused ? "继续" : "暂停";
}
function syncPbUI() {
  els.pbPlayIcon.setAttribute("d", pb.playing
    ? "M7.5 5.5h3.6v13H7.5Z M13 5.5h3.6v13H13Z"
    : "M8.5 5.5 L19 12 L8.5 18.5 Z");
  els.speedText.textContent = pb.speed.toFixed(1) + "x";
  els.fnSkipSilence.classList.toggle("active", pb.skipSilence);
}

document.getElementById("recPauseBtn").addEventListener("click", () => {
  rec.paused = !rec.paused;
  syncRecUI();
});
document.getElementById("recMarkerBtn").addEventListener("click", () => {
  rec.markers.push(rec.t);
  toast("已添加标记 " + fmtTimer(rec.t));
});
document.getElementById("stopBtn").addEventListener("click", () => {
  pb.duration = rec.duration;
  pb.t = 0;
  pb.playing = false;
  pb.markers = rec.markers.slice();
  setScreen("pb");
  // park the playhead at 30% from the left so the start of the wave is visible
  const w = els.pbStrip._w || 1200;
  pb.viewT = pb.viewTTarget = pb.t + (w * 0.2) / PPS;
  toast("录音完成 " + fmtTimer(pb.duration));
});
document.getElementById("recBack").addEventListener("click", () => {
  resetRec();
  toast("已重新开始录音");
});
document.getElementById("pbBack").addEventListener("click", () => {
  resetRec();
  setScreen("rec");
});

function resetRec() {
  rec.t = 8.90;
  rec.duration = 8.90;
  rec.paused = false;
  rec.markers = [];
  rec.viewT = rec.viewTTarget = rec.t;
  syncRecUI();
}

document.getElementById("pbPlayBtn").addEventListener("click", () => {
  if (!pb.playing && pb.t >= pb.duration - 0.005) pb.t = 0;
  pb.playing = !pb.playing;
  syncPbUI();
});
document.getElementById("fnSpeed").addEventListener("click", () => {
  pb.speed = pb.speed === 1 ? 1.5 : pb.speed === 1.5 ? 2 : 1;
  syncPbUI();
  toast("倍速 " + pb.speed.toFixed(1) + "x");
});
document.getElementById("fnSkipSilence").addEventListener("click", () => {
  pb.skipSilence = !pb.skipSilence;
  syncPbUI();
  toast(pb.skipSilence ? "跳过静音:开" : "跳过静音:关");
});
document.getElementById("fnMarker").addEventListener("click", () => {
  pb.markers.push(pb.t);
  toast("已添加标记 " + fmtTimer(pb.t));
});
document.getElementById("fnTranscribe").addEventListener("click", () => toast("原型未实现:转文本"));
document.getElementById("fnEdit").addEventListener("click", () => toast("原型未实现:编辑"));

/* ---------- Playback strip: drag to scrub ---------- */
let drag = null;
els.pbStripWrap.addEventListener("pointerdown", (e) => {
  pb.playing = false;
  syncPbUI();
  drag = { x: e.clientX, t0: pb.t };
  pb.viewT = pb.t;
  els.pbStripWrap.setPointerCapture(e.pointerId);
  els.pbStripWrap.classList.add("dragging");
});
els.pbStripWrap.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const nt = Math.min(pb.duration, Math.max(0, drag.t0 - (e.clientX - drag.x) / PPS));
  pb.t = nt; pb.viewT = nt; pb.viewTTarget = nt;
});
const endDrag = () => { drag = null; els.pbStripWrap.classList.remove("dragging"); };
els.pbStripWrap.addEventListener("pointerup", endDrag);
els.pbStripWrap.addEventListener("pointercancel", endDrag);

/* ---------- Meta switchers ---------- */
function setScreen(s) {
  screen = s;
  els.recScreen.style.display = s === "rec" ? "flex" : "none";
  els.pbScreen.style.display = s === "pb" ? "flex" : "none";
  document.querySelectorAll("#screenSeg button").forEach((b) => {
    b.classList.toggle("on", b.dataset.screen === s);
  });
  if (s === "rec") syncRecUI(); else syncPbUI();
}
document.querySelectorAll("#screenSeg button").forEach((b) => {
  b.addEventListener("click", () => setScreen(b.dataset.screen));
});
document.querySelectorAll("#themeSeg button").forEach((b) => {
  b.addEventListener("click", () => {
    document.body.dataset.theme = b.dataset.theme;
    document.querySelectorAll("#themeSeg button").forEach((x) => {
      x.classList.toggle("on", x === b);
    });
  });
});

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (screen === "rec") { rec.paused = !rec.paused; syncRecUI(); }
    else { pb.playing = !pb.playing; syncPbUI(); }
  } else if (e.code === "ArrowLeft" && screen === "pb") {
    pb.playing = false; syncPbUI();
    pb.t = Math.max(0, pb.t - 1); pb.viewTTarget = Math.max(0, pb.t);
  } else if (e.code === "ArrowRight" && screen === "pb") {
    pb.playing = false; syncPbUI();
    pb.t = Math.min(pb.duration, pb.t + 1); pb.viewTTarget = Math.max(0, pb.t);
  }
});

/* ============================================================
 * Main loop
 * ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if (screen === "rec") {
    if (!rec.paused) {
      rec.duration += dt;
      if (rec.duration > envSec - 1) ensureEnvelope(rec.duration + 60);
      rec.t = rec.duration;
      rec.viewTTarget = rec.t;   // playhead stays centered while recording
    }
    rec.viewT += (rec.viewTTarget - rec.viewT) * (1 - Math.exp(-dt * 10));
    if (Math.abs(rec.viewTTarget - rec.viewT) < 0.002) rec.viewT = rec.viewTTarget;

    renderRuler(els.recRuler, rec.viewT);
    renderStrip(els.recStrip, rec);
    els.recTimer.textContent = fmtTimer(rec.t);
  } else {
    if (pb.playing) {
      const lvl = envAt(pb.t);
      const rate = (pb.skipSilence && lvl < 0.06) ? pb.speed * 8 : pb.speed;
      pb.t = Math.min(pb.duration, pb.t + dt * rate);
      pb.viewTTarget = Math.max(0, pb.t);
      if (pb.t >= pb.duration) { pb.playing = false; syncPbUI(); }
    }
    pb.viewT += (pb.viewTTarget - pb.viewT) * (1 - Math.exp(-dt * 10));
    if (Math.abs(pb.viewTTarget - pb.viewT) < 0.002) pb.viewT = pb.viewTTarget;

    renderRuler(els.pbRuler, pb.viewT);
    renderStrip(els.pbStrip, pb);
    els.pbTimer.textContent = fmtTimer(pb.t);
    els.pbSub.textContent = fmtTimer(pb.duration);
  }

  requestAnimationFrame(loop);
}

setScreen("rec");
syncRecUI();
syncPbUI();
requestAnimationFrame(loop);
</script>
</body>
