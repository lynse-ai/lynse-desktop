<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录音界面原型 — 波形进度条 (Voice Memos 风格)</title>
<style>
  :root {
    --bg: #000;
    --stage: #1c1c1e;
    --red: #ff453a;
    --text: #ffffff;
    --text-2: #98989d;
    --text-3: #48484a;
    --icon: #d1d1d6;
    --icon-disabled: #3a3a3c;
    --blue: #0a84ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- Header ---------- */
  header { position: relative; display: flex; flex-direction: column; align-items: center; padding: 24px 0 16px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  .subtitle { margin-top: 4px; font-size: 14px; color: var(--text-2); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .hint {
    position: absolute; left: 20px; top: 26px;
    font-size: 12px; color: var(--text-3); line-height: 1.6; text-align: left;
  }
  .top-right { position: absolute; right: 20px; top: 16px; display: flex; align-items: center; gap: 14px; }
  .pill-icons { display: flex; align-items: center; gap: 18px; background: var(--stage); border-radius: 999px; padding: 9px 16px; }
  .pill-icons svg { display: block; color: #e8e8ea; }
  .check-btn {
    width: 30px; height: 30px; border-radius: 50%; background: var(--blue);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* ---------- Main waveform stage + time ruler ---------- */
  .stage-wrap { flex: 1; position: relative; background: var(--stage); min-height: 180px; cursor: grab; touch-action: none; overflow: hidden; }
  .stage-wrap.dragging { cursor: grabbing; }
  .stage-wrap canvas, .ruler canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ruler { height: 54px; position: relative; background: var(--bg); overflow: hidden; }

  /* ---------- Overview progress bar ---------- */
  .overview-wrap { padding: 16px 12px 4px; }
  .overview-track { position: relative; height: 46px; border-radius: 10px; background: var(--stage); overflow: hidden; cursor: pointer; touch-action: none; }
  .overview-track canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overview-times { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; padding: 6px 4px 0; font-variant-numeric: tabular-nums; }

  /* ---------- Bottom controls ---------- */
  .controls { display: flex; align-items: center; justify-content: space-between; padding: 10px 26px 20px; }
  .skip-cluster { display: flex; align-items: center; gap: 28px; width: 230px; }
  .ctrl-btn { background: none; border: none; color: var(--icon); cursor: pointer; padding: 6px; border-radius: 50%; display: flex; }
  .ctrl-btn:hover:not(:disabled) { color: #ffffff; }
  .ctrl-btn:disabled { color: var(--icon-disabled); cursor: default; }
  .pill-record {
    width: 150px; height: 46px; border-radius: 999px; background: var(--stage); border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .pill-record:active { filter: brightness(1.25); }
  .timer {
    width: 230px; text-align: right; font-size: 40px; font-weight: 600;
    letter-spacing: 0.5px; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hint">原型演示 · 拖动大波形 / 底部进度条可回看 · 空格 = 录音/暂停 · ▶ = 试听已录内容</div>
    <div class="title">新录音</div>
    <div class="subtitle"><span id="clock">12:44</span><span id="durationLabel">0:00</span></div>
    <div class="top-right">
      <div class="pill-icons">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="var(--stage)"/>
          <line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.4" fill="var(--stage)"/>
        </svg>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11.5a8 8 0 0 1-8.9 7.9c-1.2-.1-2.4.2-3.4.8L4 21.5l1.4-3.2A8 8 0 1 1 20 11.5z"/>
        </svg>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="7" width="13" height="13" rx="3"/><path d="M9 4h8a3 3 0 0 1 3 3v8"/>
        </svg>
      </div>
      <div class="check-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.5l5 5 10-11"/>
        </svg>
      </div>
    </div>
  </header>

  <div class="stage-wrap" id="stageWrap"><canvas id="stageCanvas"></canvas></div>
  <div class="ruler" id="rulerWrap"><canvas id="rulerCanvas"></canvas></div>

  <div class="overview-wrap">
    <div class="overview-track" id="overviewTrack"><canvas id="overviewCanvas"></canvas></div>
    <div class="overview-times"><span>0:00</span><span id="overviewDuration">0:00</span></div>
  </div>

  <div class="controls">
    <div class="skip-cluster">
      <button class="ctrl-btn" id="back15Btn" title="后退 15 秒">
        <svg width="28" height="28" viewBox="0 0 26 26" fill="none">
          <path d="M13 4 A9 9 0 1 0 22 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13 1.4 L8.4 4 L13 6.6 Z" fill="currentColor"/>
          <text x="13" y="16.8" text-anchor="middle" font-size="8" font-weight="600" fill="currentColor">15</text>
        </svg>
      </button>
      <button class="ctrl-btn" id="playBtn" title="试听">
        <svg width="28" height="28" viewBox="0 0 26 26" fill="currentColor"><path id="playIcon" d="M9.5 5.5 L21 13 L9.5 20.5 Z"/></svg>
      </button>
      <button class="ctrl-btn" id="fwd15Btn" title="前进 15 秒">
        <svg width="28" height="28" viewBox="0 0 26 26" fill="none">
          <path d="M13 4 A9 9 0 1 1 4 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13 1.4 L17.6 4 L13 6.6 Z" fill="currentColor"/>
          <text x="13" y="16.8" text-anchor="middle" font-size="8" font-weight="600" fill="currentColor">15</text>
        </svg>
      </button>
    </div>

    <button class="pill-record" id="recordPill" title="录音 / 暂停">
      <svg width="34" height="28" viewBox="0 0 34 28" fill="var(--red)">
        <g id="pillIcon"></g>
      </svg>
    </button>

    <div class="timer" id="timer">00:00.00</div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
 * Constants
 * ============================================================ */
const PX_PER_SEC = 200;   // horizontal zoom of the main waveform
const BAR_PITCH  = 4;     // css px between bar centers
const BAR_WIDTH  = 2;     // css px bar thickness
const BPS        = PX_PER_SEC / BAR_PITCH; // bars per second (50)
const ENV_RATE   = 100;   // envelope samples per second
const MAX_SEC    = 600;   // pre-generated audio length; grows on demand

const COLOR_RED    = "#ff453a";
const COLOR_TICK   = "#55555a";
const COLOR_LABEL  = "#98989d";

/* ============================================================
 * Speech-like envelope (deterministic, seeded)
 * Alternates speaking bursts and pauses with syllable modulation.
 * ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let envSec = 0;
let env = null;

function buildEnvelope(seconds, seed) {
  const n = Math.ceil(seconds * ENV_RATE);
  const out = new Float32Array(n);
  const rnd = mulberry32(seed);
  let i = 0, speaking = true, prevAmp = 0.03;
  while (i < n) {
    const len = speaking ? 0.7 + rnd() * 2.1 : 0.22 + rnd() * 0.9;
    const base = speaking ? 0.32 + rnd() * 0.62 : 0.03 + rnd() * 0.05;
    const syllFreq = 3.5 + rnd() * 2.5;
    const phase = rnd() * Math.PI * 2;
    const lenS = Math.round(len * ENV_RATE);
    for (let k = 0; k < lenS && i < n; k++, i++) {
      const tt = k / ENV_RATE;
      let a = speaking
        ? base * (0.55 + 0.45 * Math.sin(2 * Math.PI * syllFreq * tt + phase))
        : base;
      const edge = Math.min(k, lenS - k) / ENV_RATE;      // 60ms attack/decay
      const smooth = Math.min(1, edge / 0.06);
      a = prevAmp + (a - prevAmp) * smooth;
      out[i] = Math.max(0.015, a);
    }
    if (i > 0) prevAmp = out[i - 1];
    speaking = !speaking;
  }
  return out;
}

function ensureEnvelope(seconds) {
  if (env && seconds <= envSec) return;
  envSec = Math.max(seconds, envSec ? envSec * 2 : MAX_SEC);
  env = buildEnvelope(envSec, 20260906);
}
ensureEnvelope(MAX_SEC);

function hash1(i) {
  const s = Math.sin(i * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

// Envelope value with linear interpolation
function envAt(t) {
  if (t < 0) return 0;
  const x = t * ENV_RATE;
  const i0 = Math.floor(x);
  if (i0 + 1 >= env.length) return env[env.length - 1] || 0;
  const f = x - i0;
  return env[i0] * (1 - f) + env[i0 + 1] * f;
}

// Per-bar level 0..1 for main waveform
function levelAtBar(i) {
  const t = i / BPS;
  return Math.min(1, envAt(t) * (0.82 + 0.18 * hash1(i)));
}

/* ============================================================
 * State
 * ============================================================ */
let isRecording = true;   // pill state: appending new audio
let isPlaying = false;    // playback of already-recorded content
let t = 18.33;            // playhead position (seconds)
let duration = 18.33;     // total recorded length
let viewT = t;            // time shown at horizontal center
let viewTTarget = t;

/* ============================================================
 * Canvas plumbing
 * ============================================================ */
const stageWrap  = document.getElementById("stageWrap");
const rulerWrap  = document.getElementById("rulerWrap");
const overviewTrack = document.getElementById("overviewTrack");
const stageCv    = document.getElementById("stageCanvas");
const rulerCv    = document.getElementById("rulerCanvas");
const overviewCv = document.getElementById("overviewCanvas");

function fitCanvas(cv) {
  const r = cv.parentElement.getBoundingClientRect();
  const d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d));
  cv.height = Math.max(1, Math.round(r.height * d));
  cv._w = r.width; cv._h = r.height;
  cv.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
}
function fitAll() { [stageCv, rulerCv, overviewCv].forEach(fitCanvas); }
new ResizeObserver(fitAll).observe(stageWrap);
new ResizeObserver(fitAll).observe(rulerWrap);
new ResizeObserver(fitAll).observe(overviewTrack);
fitAll();

function rr(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
  else ctx.fillRect(x, y, w, h);
}

/* ============================================================
 * Rendering
 * ============================================================ */
function renderStage() {
  const ctx = stageCv.getContext("2d");
  const w = stageCv._w, h = stageCv._h;
  ctx.clearRect(0, 0, w, h);

  const mid = h / 2;
  const maxBarH = h * 0.52;
  const tLeft = viewT - (w / 2) / PX_PER_SEC;
  const tRight = viewT + (w / 2) / PX_PER_SEC;

  // waveform bars
  ctx.fillStyle = COLOR_RED;
  const iStart = Math.max(0, Math.floor(tLeft * BPS) - 1);
  const iEnd = Math.ceil(tRight * BPS) + 1;
  for (let i = iStart; i <= iEnd; i++) {
    const x = (i / BPS - viewT) * PX_PER_SEC + w / 2;
    if (x < -BAR_PITCH || x > w + BAR_PITCH) continue;
    const lvl = levelAtBar(i);
    const bh = Math.max(2.5, lvl * maxBarH);
    rr(ctx, x - BAR_WIDTH / 2, mid - bh / 2, BAR_WIDTH, bh, 1);
  }

  // playhead: thin red line + dots at both ends
  const px = w / 2;
  ctx.fillStyle = COLOR_RED;
  ctx.fillRect(px - 0.75, 4, 1.5, h - 8);
  ctx.beginPath(); ctx.arc(px, 8, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(px, h - 8, 5, 0, Math.PI * 2); ctx.fill();
}

function renderRuler() {
  const ctx = rulerCv.getContext("2d");
  const w = rulerCv._w, h = rulerCv._h;
  ctx.clearRect(0, 0, w, h);

  const tLeft = viewT - (w / 2) / PX_PER_SEC;
  const tRight = viewT + (w / 2) / PX_PER_SEC;
  const xOf = (time) => (time - viewT) * PX_PER_SEC + w / 2;

  ctx.strokeStyle = COLOR_TICK;
  ctx.fillStyle = COLOR_LABEL;
  ctx.font = "12px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "center";
  ctx.lineWidth = 1;

  // minor ticks every 0.25s / medium 0.5s / major 1s + label
  const q = Math.ceil(tLeft * 4) / 4;
  for (let s = q; s <= tRight; s += 0.25) {
    if (s < 0) continue;
    const x = Math.round(xOf(s)) + 0.5;
    const major = Math.abs(s - Math.round(s)) < 1e-6;
    const medium = Math.abs(s * 2 - Math.round(s * 2)) < 1e-6;
    const th = major ? 12 : medium ? 8 : 5;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, th);
    ctx.stroke();
    if (major) {
      const m = Math.floor(s / 60), sec = Math.round(s % 60);
      ctx.fillText(m + ":" + String(sec).padStart(2, "0"), x, 32);
    }
  }
}

function renderOverview() {
  const ctx = overviewCv.getContext("2d");
  const w = overviewCv._w, h = overviewCv._h;
  ctx.clearRect(0, 0, w, h);
  if (duration <= 0) return;

  // dense micro-bars, max-pooled per pixel column
  ctx.fillStyle = COLOR_RED;
  const mid = h / 2;
  const stripH = h * 0.32;
  const barsTotal = duration * BPS;
  const perPx = barsTotal / w;
  for (let px = 0; px < w; px++) {
    const t0 = (px * perPx) / BPS;
    const t1 = ((px + 1) * perPx) / BPS;
    let lvl = 0;
    for (let k = 0; k < 4; k++) {
      lvl = Math.max(lvl, envAt(t0 + (t1 - t0) * (k + 0.5) / 4));
    }
    const bh = Math.max(2, lvl * stripH);
    ctx.fillRect(px, mid - bh / 2, 1.4, bh);
  }

  // playhead: solid rounded bar
  const x = Math.min(w - 4, Math.max(4, (t / duration) * w));
  ctx.fillStyle = COLOR_RED;
  rr(ctx, x - 3.5, 5, 7, h - 10, 3.5);
}

/* ============================================================
 * UI text
 * ============================================================ */
const clockEl = document.getElementById("clock");
const durationLabel = document.getElementById("durationLabel");
const overviewDuration = document.getElementById("overviewDuration");
const timerEl = document.getElementById("timer");
const pillIcon = document.getElementById("pillIcon");
const playIcon = document.getElementById("playIcon");
const back15Btn = document.getElementById("back15Btn");
const fwd15Btn = document.getElementById("fwd15Btn");

function fmtClock(d) {
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function fmtTimer(s) {
  const cs = Math.floor((s % 1) * 100);
  const sec = Math.floor(s) % 60;
  const min = Math.floor(s / 60) % 60;
  const hr = Math.floor(s / 3600);
  const base = String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0") + "." + String(cs).padStart(2, "0");
  return hr > 0 ? String(hr).padStart(2, "0") + ":" + base : base;
}

function syncIcons() {
  // center pill: pause bars while recording, red record circle otherwise
  pillIcon.innerHTML = isRecording
    ? '<rect x="5" y="1" width="9" height="26" rx="4"/><rect x="20" y="1" width="9" height="26" rx="4"/>'
    : '<circle cx="17" cy="14" r="12"/>';
  // left play button: triangle when idle, pause bars while playing back
  playIcon.setAttribute("d", isPlaying
    ? "M8 5.5h3.4v15H8Z M14.6 5.5H18v15h-3.4Z"
    : "M9.5 5.5 L21 13 L9.5 20.5 Z");
  const disabled = isRecording;
  back15Btn.disabled = disabled;
  fwd15Btn.disabled = disabled;
}

/* ============================================================
 * Actions
 * ============================================================ */
function startRecording() {
  isPlaying = false;
  isRecording = true;
  t = duration;
  viewTTarget = Math.max(0, t);
  syncIcons();
}
function stopRecording() {
  isRecording = false;
  syncIcons();
}
function togglePlayback() {
  if (isPlaying) { isPlaying = false; }
  else {
    stopRecording();
    if (t >= duration - 0.005) t = 0;
    viewTTarget = Math.max(0, t);
    isPlaying = true;
  }
  syncIcons();
}
function seekTo(time) {
  stopRecording();
  isPlaying = false;
  t = Math.min(duration, Math.max(0, time));
  viewTTarget = Math.max(0, t);
  syncIcons();
}

document.getElementById("recordPill").addEventListener("click", () => {
  if (isRecording) stopRecording(); else startRecording();
});
document.getElementById("playBtn").addEventListener("click", togglePlayback);
back15Btn.addEventListener("click", () => seekTo(t - 15));
fwd15Btn.addEventListener("click", () => seekTo(t + 15));

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (isRecording) stopRecording(); else startRecording(); }
  else if (e.code === "ArrowLeft") seekTo(t - 1);
  else if (e.code === "ArrowRight") seekTo(t + 1);
});

/* ---------- Stage: drag waveform to scrub ---------- */
let stageDrag = null;
stageWrap.addEventListener("pointerdown", (e) => {
  stopRecording(); isPlaying = false; syncIcons();
  stageDrag = { x: e.clientX, t0: t };
  viewT = t;
  stageWrap.setPointerCapture(e.pointerId);
  stageWrap.classList.add("dragging");
});
stageWrap.addEventListener("pointermove", (e) => {
  if (!stageDrag) return;
  const nt = Math.min(duration, Math.max(0, stageDrag.t0 - (e.clientX - stageDrag.x) / PX_PER_SEC));
  t = nt; viewT = nt; viewTTarget = nt;
});
const endStageDrag = () => { stageDrag = null; stageWrap.classList.remove("dragging"); };
stageWrap.addEventListener("pointerup", endStageDrag);
stageWrap.addEventListener("pointercancel", endStageDrag);

/* ---------- Overview: click / drag to seek ---------- */
let ovDrag = false;
function overviewSeek(e) {
  const r = overviewTrack.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  seekTo(ratio * duration);
}
overviewTrack.addEventListener("pointerdown", (e) => {
  ovDrag = true;
  overviewTrack.setPointerCapture(e.pointerId);
  overviewSeek(e);
});
overviewTrack.addEventListener("pointermove", (e) => { if (ovDrag) overviewSeek(e); });
overviewTrack.addEventListener("pointerup", () => { ovDrag = false; });
overviewTrack.addEventListener("pointercancel", () => { ovDrag = false; });

/* ============================================================
 * Main loop
 * ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if (isRecording) {
    duration += dt;
    if (duration > envSec - 1) ensureEnvelope(duration + 60);
    t = duration;
    viewTTarget = t;
  } else if (isPlaying) {
    t = Math.min(duration, t + dt);
    viewTTarget = Math.max(0, t);
    if (t >= duration) { isPlaying = false; syncIcons(); }
  }

  // smooth view follow
  viewT += (viewTTarget - viewT) * (1 - Math.exp(-dt * 10));
  if (Math.abs(viewTTarget - viewT) < 0.002) viewT = viewTTarget;

  renderStage();
  renderRuler();
  renderOverview();

  clockEl.textContent = fmtClock(new Date());
  durationLabel.textContent = fmtDur(duration);
  overviewDuration.textContent = fmtDur(duration);
  timerEl.textContent = fmtTimer(t);

  requestAnimationFrame(loop);
}
syncIcons();
requestAnimationFrame(loop);
</script>
</body>
</html>
